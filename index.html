<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./style.css" />
        <title>hotels</title>
        <script src="./main.js" defer></script>
    </head>
    <body>
        <header class="header">
            <div class="header__container">
                <a href="#" class="header-logo"
                    ><img
                        class="logo-img"
                        src="./images/logo/logo.svg"
                        alt="Логотип"
                /></a>

                <div class="block-menu">
                    <nav class="menu">
                        <ul class="menu-list">
                            <li class="menu-list-item">
                                <a href="#" class="menu-link text"
                                    >Our Hotel
                                </a>
                            </li>
                            <li class="menu-list-item">
                                <a href="#" class="menu-link text">
                                    Rooms & Rates
                                </a>
                            </li>
                            <li class="menu-list-item">
                                <a href="#" class="menu-link text"
                                    >Facilities
                                </a>
                            </li>
                            <li class="menu-list-item">
                                <a href="#" class="menu-link text">
                                    Contact Us</a
                                >
                            </li>
                        </ul>
                    </nav>
                    <button id="search" class="search">
                        <img
                            class="search-img"
                            src="./images/icons/search.svg"
                            alt="Иконка поиска"
                        />
                    </button>
                    <form class="form" id="form">
                        <input
                            id="input"
                            type="text"
                            placeholder="Найти"
                            name="hotel"
                            class="input"
                        />
                        <button type="submit" class="btn btn-submit">
                            Найти
                        </button>
                    </form>
                </div>
            </div>
        </header>
        <section class="time">
            <div class="time__container">
                <form class="form-time" id="form-time">
                    <div class="check">
                        <!-- <span class="check-text"> Select a City </span>
                        <img src="./images/icons/Vector.svg" alt="Стрелка" /> -->
                        <label class="check-text city-label">
                            <span class="check-text" id="span-city">
                                Select a City</span
                            >

                            <div class="select-wrapper">
                                <select class="check-select select" name="city">
                                    <option value=""></option>
                                    <option value="Moscow">Moscow</option>
                                    <option value="Petersburg">
                                        Saint Petersburg
                                    </option>
                                    <option value="Novosibirsk">
                                        Novosibirsk
                                    </option>
                                    <option value="Kazan">Kazan</option>
                                    <option value="Sochi">Sochi</option>
                                </select>
                            </div>
                        </label>
                    </div>
                    <div class="check">
                        <label class="check-text calendar-label"
                            ><span class="check-text" id="span-checkIn"
                                >Check In</span
                            >
                            <input type="date" name="date" class="date-input" />
                        </label>
                    </div>
                    <div class="check">
                        <label class="check-text calendar-label"
                            ><span class="check-text" id="span-checkOut"
                                >Check Out</span
                            >
                            <input
                                type="date"
                                name="date-out"
                                class="date-input-out"
                            />
                        </label>
                    </div>
                    <button class="btn btn-check" type="submit">
                        Check Availability
                    </button>
                </form>
                <div id="calendar-result" class="hidden-calendar">
                    <button id="delete-calendar">X</button>
                    <div id="info-calendar"></div>
                </div>
            </div>
        </section>
        <main class="main">
            <div class="main__container">
                <h1 class="h1">WELCOME TO BON HOTEL</h1>
                <h2 class="h2">Good people. Good thinking. Good feeling.</h2>
                <button class="btn btn-main">EXPLORE</button>
            </div>
        </main>
    </body>
</html>
